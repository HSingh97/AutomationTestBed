[pytest]
# Enable native async support
asyncio_mode = auto

# Show verification tables and PASS/FAIL lines in the terminal while tests run
addopts = -s

# Capture INFO-level records so json-report stores ProcessMonitor case summaries
log_level = INFO

# Register custom Excel IDs
markers =
    Sanity: Core build verification tests
    CLI_01: SSH login validation
    GUI_01: API/GUI system summary validation
    CLI_190: Network ping validation from BSU to CPE
    JumboFrames: Jumbo frame MTU validation suite
    JMB_01: Jumbo case 01
    JMB_02: Jumbo case 02
    JMB_03: Jumbo case 03
    JMB_04: Jumbo case 04
    JMB_05: Jumbo case 05
    JMB_06: Jumbo case 06
    JMB_07: Jumbo case 07
    JMB_08: Jumbo case 08
    JMB_09: Jumbo case 09
    JMB_10: Jumbo case 10
    Monitor: Monitor menu GUI validations
    GUI_105: Monitor Learn Table Bridge MAC entries vs brctl
    GUI_106: Monitor Learn Table Bridge Refresh and Clear
    GUI_107: Monitor Learn Table ARP entries vs proc net arp
    GUI_108: Monitor Learn Table ARP Refresh and Clear
    GUI_83: Monitor Radio 1 Statistics Link tab validation
    GUI_84: Monitor Radio 1 Statistics Link CPE IP hyperlink opens CPE GUI
    GUI_88: Monitor Radio 1 Link Detailed Statistics Back button
    GUI_89: Monitor Radio 1 Link Detailed Statistics Disconnect button
    GUI_90: Monitor Radio 1 Link Detailed Statistics Clear button
    GUI_91: Monitor Radio 1 Link Detailed Statistics identity fields
    GUI_92: Monitor Radio 1 Link Detailed Statistics performance fields
    GUI_113: Monitor Tools Diagnostics - Ping reachable and unreachable hosts
    GUI_114: Monitor Tools Diagnostics - Traceroute to CPE
    GUI_115: Monitor Tools Diagnostics - Packet capture on Radio 1
    GUI_116: Monitor Tools Diagnostics - Console help command
    GUI_117: Monitor Tools Diagnostics - Cable length estimate vs backend
    GUI_118: Monitor Tools Diagnostics - LLDP neighbors table
    GUI_127: Monitor Tools Link Test Tool - bandwidth, duration, VLAN parameters
    GUI_128: Monitor Tools Link Test Tool - add CPE from dropdown
    GUI_130: Monitor Tools Link Test Tool - start test and validate results
    CPE_API_24: CPE btsconnect API via 2.4 GHz management (169.254.254.1)
    API_01: CPE btsconnect success (200, Connected successfully)
    API_02: CPE btsconnect authentication failure (401, authentication_fail)
    API_03: CPE btsconnect SSID not found (404, ssid_not_found)
    API_16: CPE link-throughput-test (200, success, dl_tput/ul_tput)
    API_17: CPE link-throughput-test no BTS link (409, server did not respond)
    API_18: CPE link-throughput-test in progress (503, test_in_progress)
    ArpBridgeTable: ARP and Bridge Table plan sheet (ARPBRIDGE_01–14)
    ARPBRIDGE_01: Basic ARP resolution — ping peer, verify ARP table (BTS and CPE)
    ARPBRIDGE_02: Duplicate IP/ARP — first MAC wins after re-ping (BTS and CPE)
    ARPBRIDGE_07: Gratuitous ARP — neighbor table updates after arping -U (BTS and CPE)
    ARPBRIDGE_08: Bridge br-lan — eth0 + radio ports and forwarding table (BTS and CPE)
    ARPBRIDGE_09: Bridge traffic — ping peer via br-lan, packets forwarded (BTS and CPE)
    ARPBRIDGE_10: Bridge MAC learning — peer MAC re-learned after flush + ping (BTS and CPE)
    ARPBRIDGE_11: Bridge forwarding — peer MAC on one port only, no flooding (BTS and CPE)
    ARPBRIDGE_12: Bridge FDB port update — flush peer MAC and re-learn on alternate path (BTS and CPE)
    ARPBRIDGE_13: ARP table Refresh and Clear buttons (Validation, BTS and CPE, GUI)
    ARPBRIDGE_14: Bridge table aging — idle MAC removed after ageing timeout (BTS and CPE)
    arptest_13: arptest sheet case 13 — ARP Refresh/Clear (alias for ARPBRIDGE_13)
    Radio24Scan: 2.4 GHz Radio plan sheet — Wi‑Fi scan from lab PC near CPE
    RADIO_24_01: 2.4G_RADIO_01 — verify CPE 2.4 GHz mgmt SSID is hidden (not visible in passive Wi‑Fi scan)
    RADIO_24_02: 2.4G_RADIO_02 — SSH nmcli connect hidden SSID; ping CPE mgmt IP, no internet
    RADIO_24_03: 2.4G_RADIO_03 — hidden SSID not visible; wrong password must not connect
    RADIO_24_04: 2.4G_RADIO_04 — reboot CPE; link up; hidden SSID still not in scan
    RADIO_24_08: 2.4G_RADIO_08 — FW upgrade preserve config; link up; SSID still hidden
    RADIO_24_17: 2.4G_RADIO_17 — disable CPE 2.4 GHz DHCP; scan PC must not connect on mgmt Wi‑Fi
    RADIO_24_18: 2.4G_RADIO_18 — reboot CPE (DHCP on); link up; connect; IP 169.254.254.100
    RADIO_24_19: 2.4G_RADIO_19 — toggle Wi‑Fi radio 25x (LAN up); auto-reconnect with DHCP IP
    RADIO_24_20: 2.4G_RADIO_20 — CPE Leases tab must match scan PC MAC, DHCP IP, and hostname
    RADIO_24_41: 2.4G_RADIO_41 — valid GET sw-version on CPE 2.4 GHz mgmt API (HTTP 200)
    RADIO_24_42: 2.4G_RADIO_42 — invalid API path returns error; valid API unchanged
    RADIO_24_43: 2.4G_RADIO_43 — GET sw-version read access on mgmt Wi‑Fi
    RADIO_24_44: 2.4G_RADIO_44 — invalid sw-version URL returns 404; valid GET OK
    RADIO_24_45: 2.4G_RADIO_45 — 100 GET sw-version in 1 min; CPE stays responsive
    RADIO_24_46: 2.4G_RADIO_46 — reboot CPE; backend SSH verify; GET sw-version; wait BTS link
    WirelessSecurity: Wireless Security WPA2-WPA3 plan sheet
    W_SECURITY_01: Ensure BTS and CPE Radio 1 use WPA2 / AES-256 — configure if missing, then verify (IPv6)
    W_SECURITY_07: WPA2-PSK connection — configure CPE, connect, verify association and IPv6 assigned (BTS and CPE)
    W_SECURITY_09: WPA2 association — configure CPE WPA2, connect, reboot CPE, verify association succeeds again
    W_SECURITY_11: Open mode attempt — BTS AES-256, CPE none, link must drop; restore CPE WPA2 and verify stable link
    W_SECURITY_14: Invalid passphrase — BTS + CPE AES-256, wrong CPE key, link must drop; restore key and verify link up
    W_SECURITY_03: BTS then CPE — set encryption none via SSH/UCI, validate logs, revert each (IPv6)
    W_SECURITY_05: Full none→WPA2 flow; verify measured link restore time (no timeout spam)
    W_SECURITY_06: Full none→WPA2 flow; 5-min BTS↔CPE IPv6 ping after BTS restore, then again after CPE restore
    QoS: QoS suite synced to Senao UBR P2MP Test Plan (sheet QoS)
    UserMgmt: User Management suite synced to Senao UBR P2MP Test Plan (sheet User Mgmt)
