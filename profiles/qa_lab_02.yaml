name: qa_lab_02
description: >
  qa-lab-02 (root@10.0.150.102) — PTMP bench with 4 CPEs for throughput testing.
  Update dut.local_ipv6 and dut.remote_ipv6s to match your deployed mgmt addresses.

dut:
  ip_mode: ipv6
  strict_ipv6: true
  ssh_host: "10.0.0.1"
  local_ipv6: "2401:4900:d0:40d4:0:17b8:0:330"
  remote_ipv6s:
    - "2401:4900:d0:40d4::17b8:0:331"
    - "2401:4900:d0:40d4::17b8:0:332"
    - "2401:4900:d0:40d4::17b8:0:333"
    - "2401:4900:d0:40d4::17b8:0:334"
  bts_pc_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  cpe_pc_ipv6: "2401:4900:d0:40d4::17b8:0:302"
  mgmt_oob_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  username: root
  password: Sen@0ubRNwk$

testbed:
  enabled: true
  bootstrap_on_start: true
  configure_vlan_modes: true
  strict_ipv6: true
  recovery:
    bts_fallback_ipv4: "10.0.0.1"
  factory_defaults:
    bts_vlan_mode: transparent
    cpe_vlan_mode: transparent
  qinq:
    svlan: 100
    cvlan: 101
  mgmt_vlan:
    prefix_len: 120
    uci_key: vlan.ath1.mgmtvlan
    uci_value: 101
    lab_pc_vlan_id: 101
    ipv6_bts: "2401:4900:d0:40d4:0:17b8:0:330"
    ipv6_cpe: "2401:4900:d0:40d4::17b8:0:331"
    ipv6_bts_pc: "2401:4900:d0:40d4::17b8:0:301"
    ipv6_cpe_pc: "2401:4900:d0:40d4::17b8:0:302"
    set_on_cpe: false
    bts_apply_commands: []
    cpe_apply_commands: []
  vlan_uci:
    bts_radio: ath1
    cpe_radio: ath1
    bts:
      mode_key: vlan.ath1.mode
      mode_value: transparent
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
      mgmtvlan_key: vlan.ath1.mgmtvlan
    cpe:
      radio: ath1
      mode_key: vlan.ath1.mode
      mode_value: transparent
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
  lab_pc_tagging:
    bts:
      mode: single
      vlan_id: 101
    cpe:
      mode: untagged
  vlan_ssh: {}
  primary_pc:
    # Jenkins agent qa-lab-02 runs on this host; use internet_ssh when driving remotely.
    local: true
    mgmt_interface: enp3s0
    fallback_ipv4: "10.0.0.10"
    fallback_prefix_len: 8
    internet_ssh: "root@10.0.150.102"
  secondary_pc:
    enabled: false
  wifi:
    enabled: false
    interface: wlan0
    ssid: ""
    psk: ""
  cpe_discovery:
    radio_idx: 2
    lease_commands:
      - "ubus call dhcp ipv6leases 2>/dev/null"
      - "cat /tmp/dhcp.leases 2>/dev/null"
      - "grep -r . /tmp/odhcp6d/ 2>/dev/null"
      - "ip -6 neigh show 2>/dev/null"
    discover_commands: []
  link_recovery:
    restore_bts: true
    restore_cpe: true
    bts_archive: config/BTS.tar.gz
    cpe_archive: config/CPE.tar.gz

link:
  auto_credentials: true
  cpe_fallback_ipv4: "10.0.0.1"
  always_apply_cpe_credentials: true
  tx_power_default: "1"
  radio_type: "5G"
  auth_mode: "32"
  encryption_mode: "8"
  radio_idx: 1
  cpe_radio_idx: 1
  bts_serial: ""
  ssid: ""
  expected_mode: linked
  min_connected_clients: 4
  health_check_timeout_s: 90

recovery:
  max_retries: 2
  retry_backoff_seconds:
    - 3
    - 8
  allow_factory_reset: true
  factory_reset_command: firstboot && reboot
  reboot_wait_seconds: 120
  restore_default_ip: "192.168.2.1"
  bts_restore_archive: config/BTS.tar.gz
  cpe_restore_archive: config/CPE.tar.gz

regression:
  iterations: 3
  ping_count: 5
  web_timeout_seconds: 45
  web_retry_count: 5
  web_retry_interval_seconds: 12
  web_post_ping_delay_seconds: 5
  reboot_wait_seconds: 150
  network_reload_wait_seconds: 30
  soft_reboot_ping_timeout_seconds: 200
  soft_reboot_ping_grace_seconds: 120
  firmware_ping_timeout_seconds: 420
  soft_reset_link_uptime_max_seconds: 90
  radio_idx: 1
  reboot_via_gui: false
  firmware_image: ""

traffic:
  benchmark_backend: ixia
  stats_backend: trex
  trex:
    # Two-server PTMP (4 CPE total):
    #   Server 1 (192.168.1.1): port 0 = BTS, ports 1-3 = CPE 1-3
    #   Server 2 (192.168.1.2): port 0 = CPE 4
    host: "192.168.1.1"
    user: root
    password: ubuntu
    su_servers:
      - "192.168.1.2"
    # BSU-server port allowlist: 0=BTS, 1-3=CPE (4th CPE from su_servers[0])
    ports: "0,1,2,3"
    server_cores: 1
    server_startup_s: 15

performance:
  su_count: 4
  cpe_su_index: 1
  snmp_radio_index: 2
  duration_s: 30
  packet_size: 1500
  # BTS port 0 is 100M; cap TRex load to match lab NICs (not PHY sheet rates).
  use_dynamic_target: false
  target_mbps: 100
  # For throughput, DUT-side radio/MCS apply may be environment-dependent.
  # Keep it skipped so we can still run TRex and collect SSH-based link stats (CPE count + rates).
  skip_dut_config: true
  link_stats_source: auto
  trex_dl_bw: "100M"
  trex_ul_bw: "100M"

capture:
  enabled: false

ip_tests:
  enabled: false
