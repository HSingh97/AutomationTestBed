name: default
description: Baseline testbed profile for regular GUI/link test execution.

dut:
  ip_mode: ipv6
  strict_ipv6: true
  # Management VLAN addresses (used after session bootstrap / live refresh)
  local_ipv6: "fd22:2222:222:112::100"
  remote_ipv6s:
    - "fd22:2222:222:112::d254:329"
  bts_pc_ipv6: "fd22:2222:222:112::d200"
  cpe_pc_ipv6: "fd22:2222:222:112::d201"
  cpe_pc_ip: "10.0.150.33"
  cpe_pc_password: "senao1234#"
  # Lab PC with Wi‑Fi NIC for 2.4G_RADIO scan cases (SSH + nmcli/iwlist)
  scan_pc_ip: "10.0.150.7"
  scan_pc_password: "senao1234#"
  cpe_fallback_ip: "10.0.0.1"
  mgmt_oob_ipv6: "fd22:2222:222:112::d200"
  username: root
  password: Sen@0ubRNwk$

# Session bootstrap: BTS transparent, CPE transparent, mgmt VLAN (any ID), CPE IP from BTS DHCP (SSH)
testbed:
  enabled: true
  bootstrap_on_start: true
  configure_vlan_modes: true
  strict_ipv6: true
  recovery:
    bts_fallback_ipv4: "10.0.0.120"
  factory_defaults:
    bts_vlan_mode: transparent
    cpe_vlan_mode: transparent
  # RF data path: BTS double-tag S-VLAN 100 + C-VLAN 101; CPE untagged (transparent)
  qinq:
    svlan: 100
    cvlan: 101
  mgmt_vlan:
    # /64 covers BTS ::100 and CPE ::d254:329 on the same backend-PC L2 domain
    prefix_len: 64
    uci_key: vlan.ath1.mgmtvlan
    uci_value: 101
    lab_pc_vlan_id: 101
    ipv6_bts: "fd22:2222:222:112::100"
    ipv6_cpe: "fd22:2222:222:112::d254:329"
    ipv6_bts_pc: "fd22:2222:222:112::d200"
    ipv6_cpe_pc: "fd22:2222:222:112::d201"
    set_on_cpe: false
    bts_apply_commands: []
    cpe_apply_commands: []
  vlan_uci:
    bts_radio: ath1
    cpe_radio: ath1
    bts:
      mode_key: vlan.ath1.mode
      mode_value: transparent
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
      mgmtvlan_key: vlan.ath1.mgmtvlan
    cpe:
      radio: ath1
      mode_key: vlan.ath1.mode
      mode_value: transparent
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
  lab_pc_tagging:
    # Current stand: operating mgmt IPv6 reachable untagged on enp3s0 (same L2 as fallback IPv4).
    bts:
      mode: untagged
      untagged: true
    cpe:
      mode: untagged
      untagged: true
  vlan_ssh: {}
  primary_pc:
    local: true
    mgmt_interface: enp3s0
    fallback_ipv4: "10.0.0.10"
    fallback_prefix_len: 8
    # BTS lab PC internet SSH (VLAN on enp3s0 + Wireshark). Leave empty if automation host IS the BTS PC.
    internet_ssh: ""
  secondary_pc:
    enabled: true
    # SSH target for CPE-side automation PC (set to user@host of secondary bench PC)
    ssh: "root@10.0.150.187"
    # Used when bootstrap needs to SSH to the secondary PC to change VLAN IDs / mgmt interface.
    password: "senao1234#"
    mgmt_interface: enp3s0
    fallback_ipv4: "10.0.0.11"
    fallback_prefix_len: 8
    cpe_factory_ipv4: "10.0.0.1"
  wifi:
    enabled: false
    interface: wlan0
    ssid: ""
    psk: ""
  cpe_discovery:
    radio_idx: 2
    lease_commands:
      - "ubus call dhcp ipv6leases 2>/dev/null"
      - "cat /tmp/dhcp.leases 2>/dev/null"
      - "grep -r . /tmp/odhcp6d/ 2>/dev/null"
      - "ip -6 neigh show 2>/dev/null"
    discover_commands: []
  link_recovery:
    restore_bts: true
    restore_cpe: true
    bts_archive: config/BTS.tar.gz
    cpe_archive: config/CPE.tar.gz

link:
  # AIRTEL_SSID_GEN from BTS serial (vendor/AIRTEL_SSID_GEN) — no manual SSID required
  auto_credentials: true
  cpe_fallback_ipv4: "10.0.0.1"
  always_apply_cpe_credentials: true
  tx_power_default: "1"
  airtel_gen_path: ""
  radio_type: "5G"
  auth_mode: "32"
  encryption_mode: "8"
  radio_idx: 1
  cpe_radio_idx: 1
  bts_serial: ""
  ssid: ""
  expected_mode: linked
  min_connected_clients: 1
  health_check_timeout_s: 60

recovery:
  max_retries: 2
  retry_backoff_seconds:
    - 3
    - 8
  allow_factory_reset: true
  factory_reset_command: firstboot && reboot
  reboot_wait_seconds: 120
  restore_default_ip: "192.168.2.1"
  bts_restore_archive: config/BTS.tar.gz
  cpe_restore_archive: config/CPE.tar.gz

regression:
  iterations: 3
  ping_count: 5
  web_timeout_seconds: 45
  web_retry_count: 5
  web_retry_interval_seconds: 12
  web_post_ping_delay_seconds: 5
  reboot_wait_seconds: 150
  network_reload_wait_seconds: 30
  soft_reboot_ping_timeout_seconds: 200
  soft_reboot_ping_grace_seconds: 120
  firmware_ping_timeout_seconds: 420
  soft_reset_link_uptime_max_seconds: 90
  radio_idx: 1
  reboot_via_gui: false
  firmware_image: ""

traffic:
  benchmark_backend: ixia
  stats_backend: trex

cpe_api_24:
  # Fixed CPE 2.4 GHz management REST API (always 169.254.254.1 when on CPE mgmt Wi‑Fi)
  base_url: "http://169.254.254.1"
  btsconnect_path: "/api/v1/CPE/btsconnect"
  cpe_ssh_host: "169.254.254.1"
  cpe_ssh_fallback_host: "2401:4900:d0:40d4::17b8:0:331"
  cpe_mgmt_ssid: "KWDEJPOQ"
  cpe_mgmt_password: "xvxsbulj"
  factory_reset_command: "firstboot -y && reboot"
  reset_wait_s: 180
  invalid_ssid: "UBR_INVALID_SSID_NOT_FOUND"
  invalid_password: "wrong-password-99"
  prefer_transport: auto
  fw_dir: "/tftpboot"
  fw_upload_timeout_s: 900

link_test:
  vlan_id: 0
  vlan_min: 0
  vlan_max: 4094
  duration_s: 30
  duration_min: 1
  duration_max: 300
  bw_min: 20
  bw_max: 400
  result_tolerance_throughput_mbps: 25
  result_tolerance_latency_ms: 5

# IP_01–IP_37 networking validation (tests/IP/)
ip_tests:
  enabled: true
  ipv4_address: "192.168.2.1"
  ipv4_netmask: "255.255.255.0"
  ipv4_gateway: "192.168.2.254"
  ipv6_prefix_len: 120
  ipv6_address_bts: "2401:4900:d0:40d4:0:17b8:0:330/120"
  ipv6_address_cpe: "2401:4900:d0:40d4::17b8:0:331/120"
  ipv6_address: "2401:4900:d0:40d4:0:17b8:0:330/120"
  # Bench default: lab PC mgmt IPv6 as pingable ip6gw (see dut.bts_pc_ipv6 / cpe_pc_ipv6).
  ipv6_gateway_bts: "2401:4900:d0:40d4::17b8:0:301"
  ipv6_gateway_cpe: "2401:4900:d0:40d4::17b8:0:302"
  ipv6_gateway: "2401:4900:d0:40d4::17b8:0:301"
  ipv6_fragmentation_ping_size: 2000
  ping_count_short: 4
  ping_count_long: 50
  max_ping_loss_pct: 2.0
  mtu_test_value: 1400
  reboot_timeout_s: 200
  network_reload_wait_s: 30
  # Strict IPv6: tests use mgmt IPv6 only; IPv4 is recovery-only (bootstrap --with-gui)
  fallback_ipv4: ""
  fallback_ipv6: ""
  reachability_use_device_fallback: false
  # Optional: enable throughput / backup / firmware cases
  iperf_server_v4: ""
  iperf_server_v6: ""
  backup_archive_path: ""
  firmware_image_path: ""
  use_cpe_peer: false
  remote_ping_host: ""
  # IP_17: destination CIDR reachable via gateway (defaults to device default gw)
  static_route_cidr: ""
  static_route_gateway: ""
  static_route_ping_target: ""

# User Management (UM_01–UM_50) LuCI role credentials. Env UM_* overrides these.
um:
  admin_user: admin
  admin_password: "admin1234"
  factory_admin_user: admin
  factory_admin_password: "admin1234"
  user_user: user
  user_password: senao
  installer_user: installer
  installer_password: senao123

capture:
  enabled: true
  username: root
  password: "senao1234#"
  tool: tcpdump
  artifact_dir: reports/artifacts/jumbo_captures
  remote_tmp_dir: /tmp/ubr_jumbo_captures
  # SSH targets for tcpdump on lab PCs (internet/mgmt IP). Empty bts_host → localhost when primary_pc.local.
  bts_host: ""
  cpe_host: "10.0.150.187"
  # Empty = derive from testbed.lab_pc_tagging (enp3s0.101 single-VLAN or enp3s0.100.101 QinQ)
  bts_interface: ""
  cpe_interface: ""
  # End-to-end RF-path ICMP: BTS PC mgmt IPv6 → CPE PC mgmt IPv6 (not device mgmt IPv6)
  ping_target_v6: "2401:4900:d0:40d4::17b8:0:331"
  ping_source_v6: "2401:4900:d0:40d4::17b8:0:301"
