name: default
description: Baseline testbed profile for regular GUI/link test execution.

dut:
  ip_mode: ipv6
  strict_ipv6: true
  local_ipv6: "2401:4900:d0:40d4:0:17b8:0:330"
  remote_ipv6s:
    - "2401:4900:d0:40d4::17b8:0:331"
  bts_pc_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  cpe_pc_ipv6: "2401:4900:d0:40d4::17b8:0:302"
  mgmt_oob_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  username: root
  password: Sen@0ubRNwk$

link:
  ssid: ATUMNAWJ
  expected_mode: linked
  min_connected_clients: 1
  health_check_timeout_s: 20

recovery:
  max_retries: 2
  retry_backoff_seconds:
    - 3
    - 8
  allow_factory_reset: true
  factory_reset_command: firstboot && reboot
  reboot_wait_seconds: 120
  restore_default_ip: "192.168.2.1"
  bts_restore_archive: config/BTS.tar.gz

regression:
  iterations: 3
  ping_count: 5
  web_timeout_seconds: 45
  web_retry_count: 5
  web_retry_interval_seconds: 12
  web_post_ping_delay_seconds: 5
  reboot_wait_seconds: 150
  network_reload_wait_seconds: 30
  soft_reboot_ping_timeout_seconds: 200
  soft_reboot_ping_grace_seconds: 120
  firmware_ping_timeout_seconds: 420
  soft_reset_link_uptime_max_seconds: 90
  radio_idx: 1
  reboot_via_gui: false
  firmware_image: ""

traffic:
  benchmark_backend: ixia
  stats_backend: trex

# Vaunix LDA-602 (one unit per 2x2 RF chain on automation PC)
attenuator:
  enabled: false
  backend: auto
  dll_path: "vendor/vaunix_linux_sdk/lib"
  settle_seconds: 3.0
  min_attenuation_db: 0.0
  max_attenuation_db: 63.0
  su_index: 0
  snmp:
    community: "ubr@rw123"
    radio_idx: 2
  chains:
    # Linux DEVID from GetDevInfo (1, 2). Windows Lab Brick UI may show different IDs (36831, 36832).
    - chain: 0
      device_id: 1
      serial: 55102
      lab_brick_id: 36831
      label: "MIMO chain 0"
    - chain: 1
      device_id: 2
      serial: 55602
      lab_brick_id: 36832
      label: "MIMO chain 1"

capture:
  enabled: true
  username: root
  password: ""
  tool: tcpdump
  artifact_dir: logs/jumbo_captures
  remote_tmp_dir: /tmp/ubr_jumbo_captures
  bts_host: ""
  cpe_host: ""
  bts_interface: enp3s0
  cpe_interface: enp3s0
