name: rx_sensitivity
description: >
  Conducted Rx sensitivity. BTS 192.168.2.10 is the PtP master (transmitter).
  CPE 192.168.2.11 is the PtP slave (receiver under test).
  Programmable attenuation is the Vaunix LDA on both MIMO chains.
  Set rx_sensitivity.baseline_loss_db to the fixed pads plus cable loss.

dut:
  ip_mode: ipv4
  strict_ipv6: false
  local_ip: "192.168.2.10"
  remote_ips:
    - "192.168.2.11"
  username: root
  password: "Sen@0ubRNwk$"

link:
  expected_mode: linked
  min_connected_clients: 1
  health_check_timeout_s: 90
  radio_idx: 1

recovery:
  max_retries: 1
  retry_backoff_seconds:
    - 3
  allow_factory_reset: false
  factory_reset_command: firstboot && reboot
  reboot_wait_seconds: 120

traffic:
  benchmark_backend: iperf3
  stats_backend: ssh

attenuator:
  enabled: true
  backend: auto
  settle_seconds: 3
  min_attenuation_db: 0
  max_attenuation_db: 63
  su_index: 0
  chains:
    - {chain: 0, device_id: null, serial: null, lab_brick_id: null, label: "MIMO chain 0"}
    - {chain: 1, device_id: null, serial: null, lab_brick_id: null, label: "MIMO chain 1"}

rx_sensitivity:
  direction: downlink
  bandwidth: HT20
  mcs: MCS7
  spatial_streams: 2
  radio_idx: 1
  sua_index: 1
  channel:
  baseline_loss_db: 0
  start_db: 0
  stop_db: 63
  step_db: 1
  coarse_step_db: 2
  seek_rssi_dbm: -40
  per_limit_pct: 10
  duration_s: 15
  load_fraction: 0.60
  iperf_port: 5201
  link_wait_s: 120
