name: ipv6_quickrun
description: IPv6 mgmt suite for IP_18–IP_26 (strict IPv6, /120 prefix, BTS & CPE).

dut:
  ip_mode: ipv6
  strict_ipv6: true
  local_ipv6: "2401:4900:d0:40d4:0:17b8:0:330"
  remote_ipv6s:
    - "2401:4900:d0:40d4::17b8:0:331"
  bts_pc_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  cpe_pc_ipv6: "2401:4900:d0:40d4::17b8:0:302"
  mgmt_oob_ipv6: "2401:4900:d0:40d4::17b8:0:301"
  username: root
  password: Sen@0ubRNwk$

factory_login:
  username: installer
  password: senao123

testbed:
  enabled: true
  bootstrap_on_start: true
  configure_vlan_modes: true
  strict_ipv6: true
  link_recovery:
    restore_bts: false
    restore_cpe: false
    bts_archive: config/BTS.tar.gz
    cpe_archive: config/CPE.tar.gz
  recovery:
    bts_fallback_ipv4: "10.0.0.1"
  factory_defaults:
    bts_vlan_mode: transparent
    cpe_vlan_mode: transparent
  qinq:
    svlan: 100
    cvlan: 101
  mgmt_vlan:
    prefix_len: 120
    uci_key: vlan.ath1.mgmtvlan
    uci_value: 101
    lab_pc_vlan_id: 101
    ipv6_bts: "2401:4900:d0:40d4:0:17b8:0:330"
    ipv6_cpe: "2401:4900:d0:40d4::17b8:0:331"
    ipv6_bts_pc: "2401:4900:d0:40d4::17b8:0:301"
    ipv6_cpe_pc: "2401:4900:d0:40d4::17b8:0:302"
    set_on_cpe: false
  lab_pc_tagging:
    bts:
      mode: single
      vlan_id: 101
    cpe:
      mode: untagged
  primary_pc:
    local: true
    mgmt_interface: enp3s0
    fallback_ipv4: "10.0.0.10"
    fallback_prefix_len: 8
    internet_ssh: ""
  secondary_pc:
    enabled: true
    ssh: "root@10.0.150.187"
    password: "senao1234#"
    mgmt_interface: enp3s0
    fallback_ipv4: "10.0.0.11"
    fallback_prefix_len: 8
    cpe_factory_ipv4: "10.0.0.1"

link:
  auto_credentials: true
  ssid: ""
  tx_power_default: "1"
  min_connected_clients: 1
  health_check_timeout_s: 90
  expected_mode: linked

recovery:
  max_retries: 1
  retry_backoff_seconds:
    - 1
  restore_default_ip: "10.0.0.1"
  reboot_wait_seconds: 150
  bts_restore_archive: config/BTS.tar.gz

traffic:
  benchmark_backend: ixia
  stats_backend: trex

ip_tests:
  enabled: true
  ipv6_prefix_len: 120
  ipv6_address_bts: "2401:4900:d0:40d4:0:17b8:0:330/120"
  ipv6_address_cpe: "2401:4900:d0:40d4::17b8:0:331/120"
  # Bench: use lab PC mgmt IPv6 as ip6gw so IP_21 ping6 to gateway succeeds (not logical ::…:1).
  ipv6_gateway_bts: "2401:4900:d0:40d4::17b8:0:301"
  ipv6_gateway_cpe: "2401:4900:d0:40d4::17b8:0:302"
  ipv6_address: "2401:4900:d0:40d4:0:17b8:0:330/120"
  ipv6_gateway: "2401:4900:d0:40d4::17b8:0:301"
  fallback_ipv4: ""
  fallback_ipv6: ""
  reachability_use_device_fallback: false
  ping_count_short: 2
  ip_fast_path_enabled: true
  ping_count_long: 10
  max_ping_loss_pct: 2.0
  ipv6_fragmentation_ping_size: 2000
  ip19_local_ping_rounds: 1
  ip18_apply_wait_s: 40
  ip18_apply_ping_interval_s: 3
  ip18_configure_cpe: true
  ssh_allow_ipv4_fallback: true
  mtu_test_value: 1400
  mtu_restore_value: 1500
  network_reload_wait_s: 30
  gui_settle_seconds: 12
  ip01_restore_baseline_after_case: false
  ip_skip_preflight_when_chain_ok: true
  enable_ip_post_case_recovery: true
  enable_link_recovery: true
  link_recovery_before_precheck: true
  link_recovery_after_case: true
  link_recovery_timeout_s: 90
  link_recovery_poll_s: 3
  link_recovery_tx_power: "1"
  preflight_enabled: true
  post_event_recovery_enabled: true
  stop_on_first_failure: true
  require_testbed_baseline: true
  use_cpe_peer: true
  iperf_server_v6: ""
  iperf_expected_tcp_mbps: 50
  iperf_expected_udp_mbps: 40
  iperf_min_throughput_ratio: 0.70
  iperf_port: 5201
  iperf_duration_s: 10
  iperf_udp_bandwidth: "50M"
  iperf_session_count: 1
  ipv6_link_local_iface: "br-lan"
  ipv6_link_local_peer: ""
  require_gui_for_static_ip: true
  enable_ip15_factory_restore: true
