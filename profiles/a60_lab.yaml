name: a60_lab
description: >
  A60/A61 single-CPE alpha lab — BTS SSH 10.0.0.120, CPE-side PC 192.168.2.215
  (local-only fallback on that PC: 10.0.0.121). Mgmt and VLAN traffic use IPv6 only
  (2401:4900:d0:40d4::/120). TRex override via VLAN_TREX_HOST.

dut:
  ip_mode: ipv6
  strict_ipv6: true
  ssh_host: "10.0.0.120"
  local_ipv6: "2401:4900:d0:40d4:0:17b8:0:330"
  remote_ipv6s:
    - "2401:4900:d0:40d4:0:17b8:0:3de"
  bts_pc_ipv6: "2401:4900:d0:40d4:0:17b8:0:301"
  cpe_pc_ipv6: "2401:4900:d0:40d4:0:17b8:0:302"
  cpe_pc_ip: "10.0.150.187"
  cpe_pc_password: "senao1234#"
  # Keep RF data-path alias for documentation; mgmt SSH uses 10.0.150.187 (eno1).
  cpe_pc_datapath_ip: "192.168.2.215"
  mgmt_oob_ipv6: "2401:4900:d0:40d4:0:17b8:0:301"
  username: root
  password: Sen@0ubRNwk$

testbed:
  enabled: true
  bootstrap_on_start: false
  configure_vlan_modes: true
  strict_ipv6: true
  recovery:
    bts_fallback_ipv4: "10.0.0.120"
  factory_defaults:
    bts_vlan_mode: transparent
    cpe_vlan_mode: transparent
  qinq:
    svlan: 100
    cvlan: 101
    # Firmware ethertype (not IEEE 0x8100). TRex qinq_tags.py defaults to 0x0081.
    ethertype: "0x0081"
    # This lab's TRex→DUT path does not yet forward QinQ data plane; accept UCI verify.
    allow_config_only: true
  mgmt_vlan:
    prefix_len: 120
    uci_key: vlan.ath1.mgmtvlan
    uci_value: 101
    lab_pc_vlan_id: 101
    ipv6_bts: "2401:4900:d0:40d4:0:17b8:0:330"
    ipv6_cpe: "2401:4900:d0:40d4:0:17b8:0:3de"
    ipv6_bts_pc: "2401:4900:d0:40d4:0:17b8:0:301"
    ipv6_cpe_pc: "2401:4900:d0:40d4:0:17b8:0:302"
    set_on_cpe: true
  vlan_uci:
    bts_radio: ath1
    cpe_radio: ath1
    bts:
      mode_key: vlan.ath1.mode
      mode_value: 0
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
      mgmtvlan_key: vlan.ath1.mgmtvlan
    cpe:
      radio: ath1
      mode_key: vlan.ath1.mode
      mode_value: 0
      svlan_key: vlan.ath1.svlan
      cvlan_key: vlan.ath1.cvlan
  # Transparent data path: untagged lab PC ports for TRex. Mgmt access still uses
  # mgmt_vlan.lab_pc_vlan_id (enp1s0.101) via mgmt_access_vlan_plan — do not conflate.
  lab_pc_tagging:
    bts:
      mode: untagged
      untagged: true
    cpe:
      mode: untagged
      untagged: true
  primary_pc:
    local: true
    mgmt_interface: enp1s0
    # Lab PC address on 10.0.0.0/8 (DUT backup is 10.0.0.120 — do not assign that here).
    fallback_ipv4: "10.0.0.12"
    fallback_prefix_len: 8
    internet_ssh: ""
  secondary_pc:
    enabled: true
    # Mgmt NIC on CPE-side PC (eno1). 192.168.2.215 is datapath-only and may be unreachable
    # from the automation host when that L2 segment is down.
    ssh: "root@10.0.150.187"
    password: "senao1234#"
    mgmt_interface: eno1
    datapath_ipv4: "192.168.2.215"
    fallback_ipv4: "10.0.0.215"
    fallback_prefix_len: 8
    # Live CPE LAN on CPE-side PC (not factory 10.0.0.1 — that may be another unit).
    cpe_factory_ipv4: "10.0.0.121"
  cpe_discovery:
    radio_idx: 2
    lease_commands:
      - "ubus call dhcp ipv6leases 2>/dev/null"
      - "cat /tmp/dhcp.leases 2>/dev/null"
  link_recovery:
    restore_bts: true
    restore_cpe: true
    bts_archive: config/BTS.tar.gz
    cpe_archive: config/CPE.tar.gz

link:
  auto_credentials: true
  cpe_fallback_ipv4: "10.0.0.1"
  always_apply_cpe_credentials: true
  tx_power_default: "1"
  radio_type: "5G"
  auth_mode: "32"
  encryption_mode: "8"
  radio_idx: 1
  cpe_radio_idx: 1
  expected_mode: linked
  min_connected_clients: 1
  health_check_timeout_s: 90

recovery:
  max_retries: 3
  retry_backoff_seconds:
    - 5
    - 15
    - 30
  allow_factory_reset: false
  factory_reset_command: firstboot && reboot
  reboot_wait_seconds: 150
  restore_default_ip: "10.0.0.120"
  bts_restore_archive: config/BTS.tar.gz
  cpe_restore_archive: config/CPE.tar.gz

regression:
  iterations: 1
  ping_count: 5
  reboot_wait_seconds: 150

traffic:
  benchmark_backend: ixia
  stats_backend: trex
  trex:
    host: "192.168.3.3"
    user: root
    password: ubuntu
    ports: "0,1"
    server_cores: 1
    server_startup_s: 15
    dir: "/opt/v3.06"
    pythonpath: "/opt/v3.06/automation/trex_control_plane/interactive/"
    ipv6: true

performance:
  su_count: 1
  cpe_su_index: 4
  # Short TRex bursts for VLAN suite (throughput check, not soak).
  duration_s: 8
  packet_size: 1500
  skip_dut_config: true
  cpe_via_bts: true
  link_wait_s: 2
  su_link_wait_s: 30
  bandwidth_apply_wait_s: 10

capture:
  enabled: false

ip_tests:
  enabled: true
  ipv6_prefix_len: 120
  ipv6_address_bts: "2401:4900:d0:40d4:0:17b8:0:330/120"
  ipv6_address_cpe: "2401:4900:d0:40d4:0:17b8:0:3de/120"
  ipv6_gateway_bts: "2401:4900:d0:40d4:0:17b8:0:301"
  ipv6_gateway_cpe: "2401:4900:d0:40d4:0:17b8:0:330"
  use_cpe_peer: true
